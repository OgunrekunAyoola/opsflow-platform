# CI — opsflow-platform. Two jobs:
#   secrets — gitleaks on the platform repo alone (no token needed; green standalone).
#   quality — needs @opsflow/contracts source to typecheck/build/test, so it checks out
#             the sibling repo (live source) using CI_REPO_TOKEN. That fine-grained PAT
#             (contents:read on the opsflow repos) is the only manual setup; until it's
#             added as a repo secret, this job is the only red one.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        if: github.actor != 'dependabot[bot]'
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Quality gates
    # Dependabot PRs don't receive repo secrets, so the CI_REPO_TOKEN sibling checkout
    # can't run; the bump is validated by the main-branch CI after merge.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: opsflow-platform
      - name: Checkout @opsflow/contracts (live source)
        uses: actions/checkout@v4
        with:
          repository: OgunrekunAyoola/opsflow-contracts
          # Pinned to the live branch until the master cutover (default branch lags the pivot)
          ref: main
          path: opsflow-contracts
          token: ${{ secrets.CI_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build dependency — @opsflow/contracts
        working-directory: opsflow-contracts
        run: npm ci && npm run build
      - name: Install + quality gates — platform
        working-directory: opsflow-platform
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm run lint
          npm run format:check
          npm test -- --ci --coverage
          npm run build
